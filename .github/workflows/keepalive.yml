name: keepalive

# Render's free plan sleeps after 15 minutes without traffic and the next visitor
# waits ~50s for it to wake up. Pinging it keeps the API awake.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS -m 90 -o /dev/null -w "%{http_code} in %{time_total}s\n" https://anime-hub-zz7f.onrender.com/api/status
