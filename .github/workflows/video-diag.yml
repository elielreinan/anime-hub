name: video-diag

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: App URL to test (default runs the server locally)
        default: http://localhost:3000/
      only:
        description: '"party" runs only the watch party check; "probe" tries new video sources instead'
        default: ''
  # Daily check that every source still plays; a failure e-mails the repo owner.
  schedule:
    - cron: '17 9 * * *'

permissions:
  contents: read

jobs:
  playback:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund && npm install --no-save --no-audit --no-fund playwright@1
      - name: Start server
        run: |
          nohup env PORT=3000 node server.js > server.log 2>&1 &
          sleep 3
      - name: Wait for the deployed API
        if: ${{ inputs.app_url != '' && !startsWith(inputs.app_url, 'http://localhost') }}
        run: |
          for i in $(seq 1 60); do
            curl -s -m 20 https://anime-hub-zz7f.onrender.com/api/status | grep -q "$GITHUB_SHA" && echo "API running $GITHUB_SHA" && exit 0
            sleep 10
          done
          echo "Render is not running $GITHUB_SHA yet" && exit 1
      - name: Probe new video sources
        if: ${{ inputs.only == 'probe' }}
        run: node scripts/probe-sources.js
      - name: Playback end-to-end (real Chrome)
        if: ${{ inputs.only != 'probe' }}
        env:
          APP_URL: ${{ inputs.app_url }}
          ONLY: ${{ inputs.only }}
        run: node scripts/e2e-play.js "${APP_URL:-http://localhost:3000/}"
      - name: Playback end-to-end (WebKit, Safari engine)
        if: ${{ !cancelled() && inputs.only != 'probe' && (inputs.app_url == '' || startsWith(inputs.app_url, 'http://localhost')) }}
        env:
          ONLY: ${{ inputs.only }}
        run: npx playwright install --with-deps webkit && BROWSER=webkit node scripts/e2e-play.js
      - name: Server log
        if: always()
        run: grep -v "ATV-Proxy" server.log | tail -30
