name: video-diag

on:
  push:
    branches: [claude/bold-wright-noyldb]
  workflow_dispatch:
    inputs:
      app_url:
        description: App URL to test (default runs the server locally)
        default: http://localhost:3000/

jobs:
  playback:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund && npm install --no-save --no-audit --no-fund playwright@1
      - name: Start server
        run: |
          nohup env PORT=3000 node server.js > server.log 2>&1 &
          sleep 3
      - name: Playback end-to-end (real Chrome)
        env:
          APP_URL: ${{ inputs.app_url }}
        run: node scripts/e2e-play.js "${APP_URL:-http://localhost:3000/}"
      - name: Server log
        if: always()
        run: grep -v "ATV-Proxy" server.log | tail -30
