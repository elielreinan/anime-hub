name: video-diag

on:
  push:
    branches: [claude/bold-wright-noyldb]
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund && npm install --no-save --no-audit --no-fund playwright@1
      - name: Start server
        run: |
          nohup env PORT=3000 node server.js > server.log 2>&1 &
          sleep 3
      - name: Probe
        if: ${{ contains(github.event.head_commit.message, '[probe]') }}
        run: node scripts/probe.js
      - name: Playback end-to-end (real Chrome)
        if: ${{ !contains(github.event.head_commit.message, '[probe]') }}
        run: node scripts/e2e-play.js
      - name: Server log
        if: always()
        run: tail -40 server.log
