name: checks

# Every push: syntax, undefined names, known-vulnerable dependencies, and the
# accounts/community API against a real Postgres.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: animehub
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Syntax
        run: for f in server.js lib/*.js routes/*.js sources/*.js scripts/*.js docs/js/*.js docs/sw.js; do node --check "$f" || exit 1; done
      - name: Undefined names (server)
        run: |
          npx --yes eslint@8 --no-eslintrc --env node,es2022 --parser-options ecmaVersion:2022 --rule '{"no-undef":"error","no-dupe-keys":"error","no-unreachable":"error"}' server.js lib routes sources
      - name: Vulnerable dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: API end-to-end
        env:
          DATABASE_URL: postgresql://app:app@localhost:5432/animehub
          TRUST_PROXY: '1'
          ADMIN_EMAILS: ana@test.com
          PORT: '3000'
        run: |
          nohup node server.js > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:3000/api/status | grep -q '"accounts":true' && break; sleep 1; done
          node scripts/api-test.js http://localhost:3000
      - name: Server log
        if: always()
        run: tail -40 server.log || true
