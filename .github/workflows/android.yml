name: android

# Builds the Android app (Capacitor) and publishes it as the "android" release:
# https://github.com/elielreinan/anime-hub/releases/download/android/AnimeHub.apk
# The app opens the live site, so web updates reach it without a new build.
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: [capacitor.config.json, package.json, docs/icon-512.png, .github/workflows/android.yml]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --no-audit --no-fund
      - name: Create the Android project
        run: npx cap add android && npx cap sync android
      - name: App icon
        run: |
          npm install --no-save --no-audit --no-fund sharp@0.33
          node -e '
            const sharp = require("sharp"), fs = require("fs"), res = "android/app/src/main/res";
            fs.rmSync(res + "/mipmap-anydpi-v26", { recursive: true, force: true });
            const sizes = { mdpi: 48, hdpi: 72, xhdpi: 96, xxhdpi: 144, xxxhdpi: 192 };
            Promise.all(Object.entries(sizes).flatMap(([d, px]) =>
              ["ic_launcher", "ic_launcher_round", "ic_launcher_foreground"].map(f => res + "/mipmap-" + d + "/" + f + ".png")
                .filter(f => fs.existsSync(f))
                .map(f => sharp("docs/icon-512.png").resize(px, px).toBuffer().then(b => fs.writeFileSync(f, b)))
            )).then(r => console.log("icons:", r.length));
          '
      - name: Build
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk AnimeHub.apk
          if gh release view android >/dev/null 2>&1; then
            gh release upload android AnimeHub.apk --clobber
          else
            gh release create android AnimeHub.apk --title "App Android" --notes "Instale o AnimeHub.apk no celular (permita instalar apps desta fonte). O app abre sempre a versão mais nova do site." --latest
          fi
