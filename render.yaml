services:
  - type: web
    name: anime-hub-api
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      # Postgres for accounts (e.g. Neon). Set it in the Render dashboard, never in git.
      - key: DATABASE_URL
        sync: false
